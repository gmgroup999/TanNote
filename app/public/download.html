<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ดาวน์โหลด — TanNote</title>
  <style>
    body { font-family: system-ui, 'IBM Plex Sans Thai', sans-serif; background: #18181A; color: #eee;
           display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; padding: 24px; }
    .card { max-width: 420px; text-align: center; }
    h2 { font-size: 18px; margin: 0 0 8px; }
    .btn { display: inline-block; margin-top: 18px; padding: 14px 26px; background: #E24B4A; color: #fff;
           border: none; border-radius: 12px; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; }
    .muted { color: #999; font-size: 13px; margin-top: 12px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h2 id="title">กำลังเตรียมไฟล์…</h2>
    <div id="actions"></div>
    <p class="muted" id="hint"></p>
  </div>
  <script>
    (function () {
      function parseHash() {
        var o = {};
        location.hash.replace(/^#/, '').split('&').forEach(function (p) {
          var i = p.indexOf('=');
          if (i > 0) { try { o[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); } catch (e) { o[p.slice(0, i)] = p.slice(i + 1); } }
        });
        return o;
      }
      function b64ToStr(b) {
        try { return new TextDecoder().decode(Uint8Array.from(atob(b), function (c) { return c.charCodeAt(0); })); }
        catch (e) { return ''; }
      }
      var title = document.getElementById('title');
      var actions = document.getElementById('actions');
      var hint = document.getElementById('hint');

      var p = parseHash();
      var name = p.n || 'tannote';
      var kind = p.t || 'txt';
      var content = b64ToStr(p.d || '');

      if (!content) {
        title.textContent = 'ไม่พบเนื้อหา';
        hint.textContent = 'กรุณากลับไปที่แอปแล้วกด export ใหม่อีกครั้ง';
        return;
      }

      if (kind === 'pdf') {
        // content is a full styled HTML document — render it and open print → Save as PDF
        document.open();
        document.write(content);
        document.close();
        setTimeout(function () { try { window.focus(); window.print(); } catch (e) {} }, 500);
        return;
      }

      var mime = kind === 'md' ? 'text/markdown' : kind === 'html' ? 'text/html' : 'text/plain';
      var url = URL.createObjectURL(new Blob([content], { type: mime + ';charset=utf-8' }));

      function trigger() {
        var a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      }
      trigger();
      title.textContent = 'ดาวน์โหลดแล้ว ✓';
      hint.textContent = name;

      var btn = document.createElement('a');
      btn.className = 'btn'; btn.href = url; btn.download = name; btn.textContent = 'ดาวน์โหลดอีกครั้ง';
      actions.appendChild(btn);
    })();
  </script>
</body>
</html>
