[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true

[auth]
enabled = true
site_url = "https://tannote.z-node.cc"
additional_redirect_urls = ["https://tannote.z-node.cc", "https://tannote.z-node.cc/**", "http://localhost:5173", "http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

# Edge Function: transcribe ไม่ต้องการ JWT (ใช้ X-Line-User-Id แทน)
# deploy: supabase functions deploy transcribe --no-verify-jwt
[functions.transcribe]
verify_jwt = false

[functions.ask]
verify_jwt = false

[functions.save-memory]
verify_jwt = false

[functions.send-reminders]
verify_jwt = false

[functions.line-webhook]
verify_jwt = false

[functions.admin-api]
verify_jwt = false
